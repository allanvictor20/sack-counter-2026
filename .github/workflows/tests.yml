name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        # Torch and ultralytics are a ~2 GB download and nothing in the
        # suite needs them: the end-to-end test stubs the detector, and
        # the embedder is only constructed inside a real session. Install
        # what the tests actually import instead.
        run: |
          python -m pip install --upgrade pip
          pip install opencv-python-headless numpy scipy pyyaml
          pip install fastapi 'uvicorn[standard]' jinja2 httpx
          pip install pytest

      - name: Test
        run: pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - run: ruff check sack_counter tests
